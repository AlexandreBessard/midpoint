name: Build and push midPoint image

# Mirrors build_image from .gitlab-ci.yml, ported to GitHub Actions: on every
# push to main that touches the image's actual content, build it and push it
# to ECR tagged with the short commit SHA (plus :latest). Does not run the
# import/deploy/verify chain - that stays manual for now (see DEVOPS.md).

on:
  push:
    branches: [main]
    paths:
      - 'objects/**'
      - 'Dockerfile'
      - 'import-config.sh'
      - 'import-config-ecs.sh'
  workflow_dispatch: {} # manual re-run from the Actions tab, bypasses the paths filter above

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}

jobs:
  build_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TEMPORARY - remove once the OIDC trust issue is diagnosed. Prints the
      # claims GitHub's token actually carries (not the signed token itself),
      # so we can compare them against the IAM role's trust policy condition.
      - name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$IDTOKEN" | cut -d '.' -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, repository_owner, ref, ref_type, event_name}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Fargate's default platform is x86_64 - an image built without this
          # on an ARM runner/machine won't start (CannotStartContainerError),
          # same gotcha documented in DEVOPS.md S10 for the GitLab pipeline.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_URL }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.ECR_REPOSITORY_URL }}:latest
