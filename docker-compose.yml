services:

  midpoint_data:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: midpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: midpoint

    volumes:
      - midpoint_data:/var/lib/postgresql/data

    networks:
      - midpoint

  midpoint:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      - midpoint_data

    ports:
      - "8080:8080"

    environment:
      MP_SET_midpoint_repository_jdbcUsername: midpoint
      MP_SET_midpoint_repository_jdbcPassword: ${POSTGRES_PASSWORD}
      MP_SET_midpoint_repository_jdbcUrl: jdbc:postgresql://midpoint_data:5432/midpoint
      MP_SET_midpoint_repository_database: postgresql
      MP_UNSET_midpoint_repository_hibernateHbm2ddl: "1"
      MP_NO_ENV_COMPAT: "1"

    volumes:
      - midpoint_home:/opt/midpoint/var

    command:
      - /opt/midpoint/bin/midpoint.sh
      - container

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/midpoint/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

    networks:
      - midpoint

  midpoint_import:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      midpoint:
        condition: service_healthy

    volumes:
      - midpoint_home:/opt/midpoint/var

    command:
      - /opt/midpoint/import-config.sh

    restart: "no"

    networks:
      - midpoint

volumes:
  midpoint_data:
  midpoint_home:

networks:
  midpoint: